syntax = "proto3";
package chunkserver_client;

service ChunkFs {
  rpc Push(PushRequest) returns (PushResponse);
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
}

message PushRequest {
  uint64 hash = 1;
  bytes data = 2;
}

// TODO: Errors
message PushResponse {
  bool success = 1;
}

message WriteChunkRequest {
  uint64 handle = 1;
  uint64 offset = 2;

}

// TODO: Errors
message WriteChunkResponse {
  bool success = 1;
}
