syntax = "proto3";
package chunkserver_client;

import "master-client.proto";

service ChunkFs {
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
}

message WriteChunkRequest {
  master_client.WriteRequest write_metadata = 1;
  repeated string secondaries = 2;
}

// TODO: Errors
message WriteChunkResponse {
  bool success = 1;
}


